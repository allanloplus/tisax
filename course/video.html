<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互動影音教材｜ISA 2027 for TISAX 標準要求解說</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23f2b705%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-size=%2224%22 font-weight=%22900%22 text-anchor=%22middle%22 fill=%22%230f2a44%22 font-family=%22Arial%22%3EISA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/video.css">
<link rel="preload" as="image" href="assets/img/ch/allan-smile.webp">
<link rel="preload" as="image" href="assets/img/ch/arale-happy.webp">
<script src="assets/js/license.js"></script>
<script src="assets/js/common.js"></script>
<script src="data/toc.js"></script>
</head>
<body>
<header id="topbar"></header>
<div class="wrap vlayout">
  <main>
    <div class="stage paused" id="stage">
      <div class="bgdeco"></div>
      <div class="screen" id="screen"><div class="chip" id="chip"></div><div id="slide"></div></div>
      <div class="cast">
        <figure class="actor allan dim" id="a-allan"><img id="img-allan" src="assets/img/ch/allan-smile.webp" alt="Allan 顧問"><figcaption>Allan 顧問</figcaption></figure>
        <figure class="actor arale dim" id="a-arale"><img id="img-arale" src="assets/img/ch/arale-happy.webp" alt="助教 ARALE"><figcaption>助教 ARALE</figcaption></figure>
      </div>
      <div class="subtitle" id="sub"><b id="subwho"></b><span id="subtext"></span></div>
      <div class="loading" id="loading">語音載入中…</div>
      <div class="overlay" id="overlay"><div class="big">▶</div><div class="t" id="ovt">準備開始</div><div class="s" id="ovs"></div></div>
    </div>
    <div class="controls">
      <button class="btn btn-ghost" id="bPrevSeg" title="上一段">⏮</button>
      <button class="btn btn-ghost" id="bPrev" title="上一句 (←)">◀</button>
      <button class="btn btn-primary" id="bPlay" title="播放/暫停 (空白鍵)">▶ 播放</button>
      <button class="btn btn-ghost" id="bNext" title="下一句 (→)">▶</button>
      <button class="btn btn-ghost" id="bNextSeg" title="下一段">⏭</button>
      <select id="speed" title="語速"><option value="0.85">0.85x</option><option value="1" selected>1.0x</option><option value="1.15">1.15x</option><option value="1.3">1.3x</option><option value="1.5">1.5x</option></select>
      <label class="small"><input type="checkbox" id="cc" checked> 字幕</label>
      <label class="small"><input type="checkbox" id="auto" checked> 自動播下一段</label>
      <div class="seek" id="seek" title="點選跳到該句"></div>
    </div>
    <div class="seginfo"><div><div class="small muted" id="segpath"></div><h1 id="segtitle"></h1></div>
      <div class="small muted" id="segtime"></div></div>
    <p class="small muted">提示：每一段影音只需要下載第一句語音即可開始播放，後續語音會邊播邊預先載入。看完可到 <a id="readlink" href="text.html">線上文字教材</a> 複習完整條文與稽核重點。</p>
  </main>
  <aside class="panel card">
    <div class="ptabs"><button class="on" data-p="segs">章節選擇</button><button data-p="trans">逐字稿</button></div>
    <div id="p-segs"><select id="chsel" aria-label="選擇章節"></select><div id="seglist"></div></div>
    <div id="p-trans" style="display:none"></div>
  </aside>
</div>
<script src="assets/js/player.js"></script>
<div id="unzip-hint" style="display:none;margin:40px auto;max-width:720px;padding:24px 28px;border:3px solid #c8323c;border-radius:14px;background:#fff4f4;color:#1b2430;font:18px/1.8 'Microsoft JhengHei','PingFang TC',sans-serif">
  <b style="font-size:22px;color:#c8323c">⚠ 請先將壓縮檔「全部解壓縮」再開啟</b><br>
  目前網頁是直接從 zip 壓縮檔中開啟，樣式、圖片與程式檔沒有一起解出來，所以無法正常顯示。<br>
  請在 zip 檔上按右鍵 →「<b>全部解壓縮…</b>」，再到解壓縮後的資料夾中開啟 <b>index.html</b>。
</div>
<script>if (!window.renderTopbar) { var h = document.getElementById('unzip-hint'); h.style.display = 'block'; document.body.insertBefore(h, document.body.firstChild); }</script>
</body>
</html>
